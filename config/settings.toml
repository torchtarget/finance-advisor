[strategy]
# Lookback period for technical indicators (trading days)
lookback_days = 30

# Holding period target (calendar days)
holding_period_days = 7

# Minimum signal confidence to act (0.0 - 1.0)
min_confidence = 0.5

# Maximum concurrent recommendations
max_positions = 3

# Strategies to enable — all aggressive/short-term
enabled_strategies = [
    "momentum_breakout",
    "mean_reversion_oversold",
    "squeeze_setup",
    "earnings_gap",
    "high_short_interest",
    "volume_spike",
]

[risk]
# HIGH RISK: Only constraint is never losing more than invested capital.
# No margin, no leverage. Starting capital: $1,000

# Can go all-in on one pick
max_position_size = 1.0

# Accept total loss of invested capital
weekly_loss_limit = 1.0

# No stop-loss — ride the full week
stop_loss = 0.0

# No take-profit — manual decision
take_profit = 0.0

use_trailing_stop = false

# Go heavy on highest conviction pick
sizing_method = "conviction_weighted"

[market_data]
# API keys for supplementary data (optional, enhances signals)
finnhub_api_key = ""
newsapi_key = ""

# Instruments available on DeGiro — focus on US exchanges
# These are scanned for weekly opportunities
# 906 = NYSE, 908 = NASDAQ (also available on DeGiro)
exchanges = [906, 908]

asset_types = ["stock"]

# Filters
min_avg_volume = 500000
min_price = 1.0
max_price = 500.0
min_volatility_percentile = 75

[scanner]
# Weekly scanner settings

# Pre-market gap threshold (fraction)
gap_threshold = 0.03

# Volume spike multiplier vs 20-day average
volume_spike_multiplier = 2.0

# RSI oversold/overbought thresholds
rsi_oversold = 25
rsi_overbought = 75

# Short interest ratio threshold
short_interest_min = 10.0

# Minimum ATR as % of price
min_atr_pct = 3.0

# Days until earnings to flag as catalyst
earnings_window_days = 7

[schedule]
# Weekly cycle
scan_day = "monday"
scan_time = "09:35"
exit_day = "friday"
exit_time = "15:30"

midweek_check = true
midweek_day = "wednesday"
midweek_time = "12:00"

[alerts]
telegram_bot_token = ""
telegram_chat_id = ""
