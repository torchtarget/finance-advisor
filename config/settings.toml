[strategy]
lookback_days = 30
holding_period_days = 7

# Higher confidence = better filter, avoids catastrophic picks
min_confidence = 0.5

# ALL-IN: one pick, full capital, maximum risk
max_positions = 1

# Rank signals by expected return (not confidence)
ranking = "expected_return"

enabled_strategies = [
    "momentum_breakout",
    "mean_reversion_oversold",
    "squeeze_setup",
    "earnings_gap",
    "high_short_interest",
    "volume_spike",
]

[risk]
# MAX RISK — all-in every week, accept total loss
max_position_size = 1.0
weekly_loss_limit = 1.0
stop_loss = 0.0
take_profit = 0.0
use_trailing_stop = false
sizing_method = "all_in"

[market_data]
finnhub_api_key = ""
newsapi_key = ""
exchanges = [906, 908, 710, 663, 718, 712]
asset_types = ["stock"]
min_avg_volume = 100000
min_price = 1.0
max_price = 1000.0
min_volatility_percentile = 75

[scanner]
gap_threshold = 0.03
volume_spike_multiplier = 2.0
rsi_oversold = 25
rsi_overbought = 75
short_interest_min = 10.0
min_atr_pct = 3.0
earnings_window_days = 7

[schedule]
entry_day = "monday"
exit_day = "monday"

[alerts]
telegram_bot_token = ""
telegram_chat_id = ""
