[project]
name = "finance-advisor"
version = "0.1.0"
description = "High-risk weekly speculative trading advisor for DeGiro instruments"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    # ta indicators computed with pandas/numpy directly
    "apscheduler>=3.10.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",
    "httpx>=0.24.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "finnhub-python>=2.4.0",
    "newsapi-python>=0.2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[project.scripts]
finance-advisor = "src.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
